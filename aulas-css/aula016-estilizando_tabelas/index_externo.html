<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo de estilização de tabelas</title>
    <!--CSS-->
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <header>
      <h1>Estabecendo Tabelas</h1>
    </header>

    <main>
      <section>
        <article>
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Obama</td>
                <td>18</td>
                <td>Juiz de Fora</td>
              </tr>
              <tr>
                <td>George Bush</td>
                <td>19</td>
                <td>Juiz de Fora</td>
              </tr>
              <tr>
                <td>Jonh F.Kennedy</td>
                <td>24</td>
                <td>Juiz de Fora</td>
              </tr>
              <tr>
                <td>Abraham Lincolm</td>
                <td>35</td>
                <td>Juiz de Fora</td>
              </tr>
            </tbody>
          </table>
        </article>
      </section>
    </main>
  </body>
</html>
