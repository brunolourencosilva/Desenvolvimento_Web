<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade004 Modularizada</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>

      <header>
        <h1>Atividade004 Modularizada</h1>
      </header>
    
    <main>
      <section class="container">
        <!-- PAR OU IMPAR -->
        <article class="conteudo">

          <h1 class="titulo_estilo">Verificar se é par ou impar</h1>

          <input id="valor_par_impar" type="number">
          <button type="button" id="verificar_par_impar">Verificar numero</button>

          <h2 class="estilo_resultado">Resultado: <span id="resultado_par_impar"></span></h2>
        </article>

        <!-- MAIOR OU MENOR -->
        <article class="conteudo">

          <h1 class="titulo_estilo">Verificar se é maior ou menor</h1>

          <input id="valor_MaiorMenor1" type="number">
          <input id="valor_MaiorMenor2" type="number">
          <input id="valor_MaiorMenor3" type="number">

          <button type="button" id="verificar_MaiorMenor">Verificar numero</button>

          <h2 class="estilo_resultado">Resultado: <span id="resultado_MaiorMenor"></span></h2>
        </article>

        <!-- monitoramento velocidade -->
        <article class="conteudo">

          <h1 class="titulo_estilo">Verificar limite de velocidade</h1>

          <input id="valor_Velocidade" type="number">

          <button type="button" id="verificar_Velocidade">Verificar numero</button>

          <h2 class="estilo_resultado">Resultado: <span id="resultado_Velocidade"></span></h2>
        </article>

        <!-- Aumento de salario -->
        <article class="conteudo">

          <h1 class="titulo_estilo">Calcular aumento do salario</h1>

          <input id="valor_salario" type="number">

          <button type="button" id="verificar_salario">Verificar salario</button>

          <h2 class="estilo_resultado">Resultado: <span id="resultado_salario"></span></h2>
        </article>

        <!-- Calcular passagem de onibus -->
        <article class="conteudo">

          <h1 class="titulo_estilo">Calcularpassagem de onibus</h1>

          <input id="valor_passagem" type="number">

          <button type="button" id="verificar_passagem">calcular passagem</button>

          <h2 class="estilo_resultado">Resultado: <span id="resultado_passagem"></span></h2>
        </article>
      </section>

    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
