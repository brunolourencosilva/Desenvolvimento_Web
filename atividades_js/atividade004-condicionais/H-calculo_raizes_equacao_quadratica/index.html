<!-- A plataforma educacional MathSolver Online quer disponibilizar uma calculadora
que ajude alunos a entenderem equações quadráticas. Crie uma página que calcule
as raízes da equação 𝑥²−6𝑥+5, utilizando os conceitos da fórmula de Bhaskara,
mas sem usar funções prontas. O sistema deve exibir as raízes calculadas (x’ = 5
e x’’ = 1) e explicar, se possível o processo do cálculo. -->

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcular Bhaskara</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>

    <main>
        <form id="formulario">
          <header id="titulo_estilo">
            <h1>Calcular Bhaskara</h1>
          </header>

          <section>
            <p>Calculo das raizes de 𝑥²−6𝑥+5</p>
          </section>
  
          <button type="button" id="verificar">Fazer conta de Bhaskara</button>
  
          <span id="resultado"></span>
        </form>
      </main>
    <script src="js/script.js"></script>
  </body>
</html>
