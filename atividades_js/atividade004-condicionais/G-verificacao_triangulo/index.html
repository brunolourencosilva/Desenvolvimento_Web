<!-- O site educativo TriangulaWeb precisa de uma página interativa onde os usuários
informam as medidas de três segmentos de reta. O sistema então verifica e
informa se esses segmentos podem formar um triângulo, com base na regra
matemática da desigualdade triangular. O feedback deve ser claro e visual. -->


<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de triangulo</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>

    <main>
        <form id="formulario">
          <header>
            <h1>Verificador de triangulo</h1>
          </header>
  
          <label for="valor1">Escreva o 1º valor</label>
          <input id="valor1" type="number">
  
          <label for="valor2">Escreva o 2º valor</label>
          <input id="valor2" type="number">
  
          <label for="valor3">Escreva o 3º valor</label>
          <input id="valor3" type="number">
  
          <button type="button" id="verificar">Verificar valores</button>
  
          <h2 id="resultado">O resultado: <span id="resultado"></span></h2>
        </form>
      </main>
    <script src="js/script.js"></script>
  </body>
</html>
