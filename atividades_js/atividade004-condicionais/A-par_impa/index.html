<!-- A empresa WebData Solutions contratou você para desenvolver uma página
interativa que ajude seus usuários a classificar números. Eles precisam de uma
interface onde o usuário insira um número inteiro, clique em um botão e receba
na tela a informação se o número é par ou ímpar. Esse recurso será integrado ao
site da empresa para pequenos cálculos rápidos. -->

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impar ou par</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>

    <header>
      <h1>Impar ou par?</h1>
    </header>

    <main id="container ">
      <form id="formulario">

        <label for="valor">Adicione um numero inteiro</label>
        <input id="valor" type="number">
        <button type="button" id="verificar">Verificar numero</button>

        <h2>O resultado: <span id="resultado"></span></h2>
      </form>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
