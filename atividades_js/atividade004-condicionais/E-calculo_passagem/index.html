<!-- A agência online ViaWeb Viagens deseja uma calculadora de preços para passagens
de ônibus no site. Crie uma página onde o usuário informa a distância da viagem
em quilômetros, e o site calcula o preço total, conforme a regra: Viagens de até
200 km custam R$0,70 por km. Viagens acima de 200 km custam R$0,40 por km. O
valor final deve ser exibido de forma clara, simulando o funcionamento de um
sistema real de vendas de passagens. -->

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de preços para passagens de ônibus</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>

    <main>
      <form id="formulario">
        <h1 id="titulo_estilo">Calculadora de passagens de ônibus</h1>

        <label for="valor">Insira a distância em km:</label>
        <input id="valor" type="number">

        <button type="button" id="verificar">Calcular:</button>

        <h2 id="resultado">O resultado: <span id="resultado"></span></h2>
      </form>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
